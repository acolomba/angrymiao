# sonarcloud configuration for angrymiao
sonar.projectKey=acolomba_angrymiao
sonar.organization=acolomba

# project metadata
sonar.projectName=angrymiao
sonar.projectVersion=0.1.0

# source code settings
sonar.sources=src
sonar.tests=test,features
sonar.python.version=3.11

# coverage settings
sonar.python.coverage.reportPaths=coverage.xml

# exclusions
sonar.exclusions=venv/**,build/**,dist/**,.venv/**
sonar.test.exclusions=test/**,features/**

# encoding
sonar.sourceEncoding=UTF-8
