[project]
name = "angrymiao"
version = "0.1.0"
description = "Command-line firmware upgrades for Angry Miao devices"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Alessandro Colomba", email = "acolomba@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

dependencies = [
    "pyserial>=3.5",
    "requests>=2.34.2",
]

[project.scripts]
am = "angrymiao.__main__:main"

[project.optional-dependencies]
# development dependencies
dev = [
    "behave~=1.2",
    "black>=25.11,<27.0",
    "mypy~=1.14",
    "pre-commit~=4.3",
    "PyHamcrest~=2.1",
    "pylint~=3.3",
    "pytest~=8.3",
    "pytest-cov~=7.0",
    "python-lsp-server~=1.14",
    "requests~=2.32",
    "ruff~=0.9",
]

[project.urls]
Homepage = "https://github.com/acolomba/angrymiao"
Repository = "https://github.com/acolomba/angrymiao"
Issues = "https://github.com/acolomba/angrymiao/issues"

[build-system]
requires = ["setuptools>=58.0.4"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "I",   # isort
    "N",   # pep8-naming
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black/ruff-format)
    "UP007", # use X | Y for type annotations (not compatible with Python 3.9)
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["venv/", "build/", "dist/"]

# ignores third-party packages without type stubs
[[tool.mypy.overrides]]
module = ["requests", "hamcrest"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "angrymiao_test"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "_pytest.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "features.steps.*"
disallow_untyped_decorators = false

[tool.coverage.run]
# uses parallel mode to create separate coverage files that can be combined
parallel = true
source = ["src"]
# excludes test and mock code from coverage collection
omit = [
    "test/*",
    "features/*",
]

[tool.coverage.report]
# excludes test and mock code from coverage reports
omit = [
    "test/*",
    "features/*",
]

[tool.coverage.html]
directory = "coverage_report"

[tool.pylint.messages_control]
disable = [
    "line-too-long",  # handled by black/ruff
]

[tool.pylint.format]
max-line-length = 88  # for consistency with black/ruff
